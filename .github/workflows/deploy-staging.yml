name: Deploy STAGING

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate, migrate, and deploy STAGING
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: staging
    permissions:
      contents: write
    env:
      DEPLOY_TARGET_ENV: staging
      DEPLOY_EXPECTED_PROJECT_REF: cqeaxlttezunirsmkrxz
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      DEPLOY_EXPECTED_SHA: ${{ github.sha }}
      STAGING_APP_ORIGIN: ${{ vars.STAGING_APP_ORIGIN }}

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v4

      - name: Verify exact checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build application
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_ANON_KEY: placeholder-anon-key
          DATABASE_URL: postgresql://postgres:password@localhost:5432/postgres
        run: pnpm build

      - name: Apply explicit STAGING migrations
        run: pnpm db:migrate

      - name: Verify STAGING migrations and schema
        run: pnpm verify:staging-migration

      - name: Promote exact tested SHA to staging-release
        uses: actions/github-script@v7
        with:
          script: |
            if (context.ref !== 'refs/heads/main' || !/^[a-f0-9]{40}$/.test(context.sha)) {
              throw new Error('Only an exact main commit may be promoted.');
            }
            const repo = context.repo;
            const ref = 'heads/staging-release';
            let exists = true;
            try {
              await github.rest.git.getRef({ ...repo, ref });
            } catch (error) {
              if (error.status !== 404) throw error;
              exists = false;
            }
            if (exists) {
              await github.rest.git.updateRef({ ...repo, ref, sha: context.sha, force: false });
            } else {
              await github.rest.git.createRef({ ...repo, ref: 'refs/heads/staging-release', sha: context.sha });
            }
            const promoted = await github.rest.git.getRef({ ...repo, ref });
            if (promoted.data.object.sha !== context.sha) {
              throw new Error('Release branch does not match the tested commit.');
            }

      - name: Trigger STAGING Deploy Hook
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: pnpm deploy:staging-hook

      - name: Wait for exact deployed SHA
        run: pnpm verify:staging-release

      - name: Verify stable STAGING deployment
        run: pnpm verify:staging-smoke
